name: kb

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Round-9 audit: a UTF-8 BOM in package.json took the plugin down once and
      # CI did not parse the bundle at all. This gate parses every JSON config,
      # checks the manifest/patch/files the profile loader reads, and syntax-checks
      # the engine + plugin sources before any functional test runs.
      - name: Plugin package and bundle load check
        shell: pwsh
        run: node _meta/scripts/check-plugin-load.mjs

      - name: Validate notes and indexes
        shell: pwsh
        run: node _meta/scripts/kb.mjs validate

      - name: Plugin unit tests
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem _meta/plugin/kb-panel/test/*.test.mjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Smoke (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File _meta/scripts/smoke.ps1

      - name: Smoke (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File _meta/scripts/smoke.ps1

      - name: Build sanitized public snapshot
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'public-snapshot'
          node _meta/scripts/export-public.mjs --out $out
          Push-Location $out
          node _meta/scripts/kb.mjs rebuild
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node _meta/scripts/kb.mjs validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $leak = Get-ChildItem $out -Recurse -File | Select-String -Pattern 'C:\\Users\\' -List
          if ($leak) {
            $leak | ForEach-Object { Write-Error "public snapshot leaks a local path: $($_.Path)" }
            exit 1
          }
          # The telemetry leak class (round 11): rotated access files, runtime
          # state, transcripts and session UUIDs must never reach a public tree.
          $bad = Get-ChildItem $out -Recurse -File | Where-Object {
            $_.Name -like 'access*.jsonl' -or
            $_.FullName -match '\\_meta\\state\\' -or
            $_.FullName -match '\\10_Raw\\' -or
            $_.Name -eq 'PROJECT_PLAN.md'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "public snapshot contains a forbidden file: $($_.FullName)" }
            exit 1
          }
          $ids = Get-ChildItem $out -Recurse -File | Select-String -Pattern 'session-[0-9a-f]{8}' -List
          if ($ids) {
            $ids | ForEach-Object { Write-Error "public snapshot leaks a session id: $($_.Path)" }
            exit 1
          }
          Pop-Location
