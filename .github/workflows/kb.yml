name: kb

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Round-9 audit: a UTF-8 BOM in package.json took the plugin down once and
      # CI did not parse the bundle at all. This gate parses every JSON config,
      # checks the manifest/patch/files the profile loader reads, and syntax-checks
      # the engine + plugin sources before any functional test runs.
      - name: Plugin package and bundle load check
        shell: pwsh
        run: node _meta/scripts/check-plugin-load.mjs

      - name: Validate notes and indexes
        shell: pwsh
        run: node _meta/scripts/kb.mjs validate

      - name: Plugin unit tests
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem _meta/plugin/kb-panel/test/*.test.mjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Script unit tests (export rules)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem _meta/scripts/test/*.test.mjs | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Smoke (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File _meta/scripts/smoke.ps1

      - name: Smoke (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File _meta/scripts/smoke.ps1

      - name: Build sanitized public snapshot
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'public-snapshot'
          # Negative regressions for the export gate:
          #  (a) round 12 seam: suffix-bound patterns let `access.jsonl.bak` through;
          #  (b) round 13 seam: 6-7 hex short session ids passed the 8-hex floor.
          # Plant both classes, then prove the export drops (a) and sanitizes (b).
          $planted = @('_meta/access-test.jsonl', '_meta/access-test.jsonl.bak', '_meta/rules/session-test.md')
          foreach ($p in $planted) {
            New-Item -Path $p -ItemType File -Force | Out-Null
            if ($p -like '*session-test.md') {
              Set-Content -Path $p -Value 'short session-<redacted> and long session-<redacted>fd77e6' -Encoding UTF8
            } else {
              Set-Content -Path $p -Value '{"id":"planted-telemetry"}' -Encoding UTF8
            }
          }
          node _meta/scripts/export-public.mjs --out $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($p in $planted) {
            Remove-Item -Path $p -Force -ErrorAction SilentlyContinue
            if ($p -like '*session-test.md') {
              $exported = Join-Path $out $p
              if (-not (Test-Path $exported)) { Write-Error "export lost the planted text fixture: $p"; exit 1 }
              if ((Get-Content $exported -Raw) -match 'session-[0-9a-f]{6}') {
                Write-Error "export failed to sanitize the short session id fixture"
                exit 1
              }
            } elseif (Test-Path (Join-Path $out $p)) {
              Write-Error "public snapshot exported planted telemetry: $p"
              exit 1
            }
          }
          Push-Location $out
          node _meta/scripts/kb.mjs rebuild
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node _meta/scripts/kb.mjs validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $leak = Get-ChildItem $out -Recurse -File | Select-String -Pattern 'C:\\Users\\' -List
          if ($leak) {
            $leak | ForEach-Object { Write-Error "public snapshot leaks a local path: $($_.Path)" }
            exit 1
          }
          # The telemetry leak class (rounds 11-12): access* family (any suffix),
          # runtime state, transcripts and session UUIDs must never be public.
          $bad = Get-ChildItem $out -Recurse -File | Where-Object {
            $_.Name -like 'access*' -or
            $_.FullName -match '\\_meta\\state\\' -or
            $_.FullName -match '\\10_Raw\\' -or
            $_.Name -eq 'PROJECT_PLAN.md'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "public snapshot contains a forbidden file: $($_.FullName)" }
            exit 1
          }
          $ids = Get-ChildItem $out -Recurse -File | Select-String -Pattern 'session-[0-9a-f]{6}' -List
          if ($ids) {
            $ids | ForEach-Object { Write-Error "public snapshot leaks a session id: $($_.Path)" }
            exit 1
          }
          Pop-Location
