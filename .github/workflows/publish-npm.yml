name: Publish npm package

# Publishes dsh-kb-panel to npm.
#
# Auth: the NPM_TOKEN repository secret holds a publish-capable npm token.
# Prefer a granular token with "Bypass two-factor authentication (2FA)" off and
# the package's Trusted Publisher configured (see below); a Classic "Automation"
# token also works. OIDC trusted publishing is still enabled (`id-token: write`),
# so provenance is attached by the registry; when the Trusted Publisher exists
# npm uses it and ignores the token.
#
# One-time setup on npm (package settings → Trusted Publisher → GitHub Actions):
#   organization/user : shehuilaoliumang
#   repository        : dsh-memory
#   workflow filename : publish-npm.yml
#   environment       : (leave empty)
# The workflow filename, repository and ref must match exactly; npm rejects the
# OIDC token otherwise.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Show tool versions
        run: node --version && npm --version

      - name: Plugin load-shape gate
        run: node _meta/scripts/check-plugin-load.mjs

      - name: Build npm package (vendored engine)
        run: node _meta/scripts/build-npm.mjs --out dist-npm

      # setup-node writes an .npmrc that reads NODE_AUTH_TOKEN, so the token is
      # never interpolated into a command line. Registry is pinned explicitly so
      # a stray user/global npmrc cannot redirect the publish.
      - name: Publish to npm
        working-directory: dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm publish --access public --provenance
