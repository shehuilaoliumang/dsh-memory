name: Publish npm package

# Publishes dsh-kb-panel to npm with trusted publishing (OIDC): no long-lived
# token, no 2FA bypass token, provenance attached by the registry.
#
# One-time setup on npm (package settings → Trusted Publisher → GitHub Actions):
#   organization/user : shehuilaoliumang
#   repository        : dsh-memory
#   workflow filename : publish-npm.yml
#   environment       : (leave empty)
# The workflow filename, repository and ref must match exactly; npm rejects the
# OIDC token otherwise (it answers "OIDC token exchange error - package not found").

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No `registry-url` here on purpose: setup-node would then write an
      # `.npmrc` holding `_authToken=${NODE_AUTH_TOKEN}` (defaults to the GitHub
      # token), npm would authenticate with it and answer 404 instead of
      # exchanging the OIDC token. With no credential on disk, the Trusted
      # Publisher flow is the only one left.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Show tool versions
        run: node --version && npm --version

      - name: Plugin load-shape gate
        run: node _meta/scripts/check-plugin-load.mjs

      - name: Build npm package (vendored engine)
        run: node _meta/scripts/build-npm.mjs --out dist-npm

      # Refuse to publish a package that cannot be used from an empty store.
      - name: Fresh install smoke (empty store)
        run: node _meta/scripts/smoke-install.mjs

      # No NODE_AUTH_TOKEN and no setup-node `registry-url`: either one leaves an
      # `_authToken` on disk, npm then authenticates with that credential and the
      # registry answers 404 instead of exchanging the OIDC token. With nothing
      # stored, the Trusted Publisher exchange is the only path left.
      #
      # If this step reports `OIDC token exchange error - package not found`,
      # npm has no matching Trusted Publisher on package settings → Access.
      - name: Check OIDC availability
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || { echo "id-token: write is missing"; exit 1; }
          echo "workflow: $GITHUB_WORKFLOW_REF"

      - name: Publish to npm
        working-directory: dist-npm
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npm publish --access public --provenance --registry https://registry.npmjs.org/
